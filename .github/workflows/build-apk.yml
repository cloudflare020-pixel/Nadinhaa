name: Gerar APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Juntar e extrair o projeto
        run: |
          cat parte*.bin > projeto.zip
          unzip -q projeto.zip
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
      - name: Build do jogo offline
        working-directory: coffe-mania-main
        run: |
          npm install
          npm install -w game -D @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm run build:offline
      - name: Projeto Android
        working-directory: coffe-mania-main/game
        run: |
          npx cap add android
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Compilar APK
        working-directory: coffe-mania-main/game/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cafe-mania-offline-apk
          path: coffe-mania-main/game/android/app/build/outputs/apk/debug/app-debug.apk
